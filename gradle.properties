# Project-wide Gradle settings.

# JVM for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Limit parallel workers to keep CI runners stable.
org.gradle.workers.max=4

# Parallel module builds + build cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin code style.
kotlin.code.style=official

# AndroidX is required for all Jetpack libraries.
android.useAndroidX=true
android.nonTransitiveRClass=true
