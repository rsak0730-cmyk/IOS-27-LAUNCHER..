name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'build-tools;35.0.0 platform-tools platforms;android-35'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core:test --no-daemon --stacktrace 2>&1 | tee tests.log

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Inspect build outputs
        if: always()
        run: |
          {
            echo "## Build output inspection"
            echo '```'
            echo "--- APK files ---"
            find app/build -type f -name '*.apk' 2>/dev/null || echo "(no apk found)"
            echo "--- outputs tree ---"
            find app/build/outputs -type f 2>/dev/null | head -40 || echo "(no outputs dir)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "Build log tail (errors):"
            grep -iE "error:|FAILED|What went wrong|Caused by|Execution failed|Could not|> Task .* FAILED|A failure occurred" build.log | tail -n 40 | sed 's/^/::error::/' || true
            echo "::error::--- full build.log tail ---"
            tail -n 60 build.log | sed 's/^/::error::/' || true
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-launcher-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
